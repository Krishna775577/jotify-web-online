<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jotify music: songs, albums, playlists and YouTube video discovery.">
  <meta name="theme-color" content="#101517">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jotify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jotify · Your Music, Reimagined</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="/jotify-home-shell.css?v=1">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Jotify YT navigation: desktop sidebar entry below Library; compact mobile tab. -->
  <style>
    #jotify-yt-nav{
      position:fixed;left:0;top:calc(50% + 184px);z-index:2147483000;
      width:70px;height:66px;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:4px;box-sizing:border-box;text-decoration:none;
      background:#17231c;color:#f5f8f6;font:600 13px/1.1 system-ui,-apple-system,Segoe UI,sans-serif;
      transition:color .16s,background .16s;
    }
    #jotify-yt-nav:hover,#jotify-yt-nav:focus-visible{
      background:#263a2c;color:#12e779;outline:2px solid #14cf70;outline-offset:-2px;
    }
    #jotify-yt-nav svg{width:23px;height:23px;display:block}
    @media(max-width:800px){
      #jotify-yt-nav{top:auto;bottom:12px;left:auto;right:12px;width:64px;height:58px;
        border:1px solid #2c6947;border-radius:12px;box-shadow:0 5px 25px #0009}
    }
  </style>
  <a id="jotify-yt-nav" href="/yt.html" title="YT - music and video search" aria-label="Open YT">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="5" width="20" height="14" rx="4" fill="#e62d3b"/>
      <path d="m10 9 6 3-6 3V9Z" fill="#fff"/>
    </svg>
    <span>YT</span>
  </a>
</body>
</html>
